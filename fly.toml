# Set `app` to a unique name before `fly launch --copy-config`.
app = "hop-webhook-sink"
primary_region = "iad"

[build]

[env]
  LOG_PATH = "/data/webhooks.jsonl"
  PORT = "8080"

[mounts]
  source = "sink_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
